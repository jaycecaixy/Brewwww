name: Brewwww
options:
  bundleIdPrefix: com.xiuyuancai
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_NSCameraUsageDescription: 用于拍摄饮品照片并添加记录。
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 用于选择饮品照片并添加记录。
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 用于查找附近咖啡店、在地图查看当前位置，并为所选店铺保存位置与城市。
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  BrewwwwTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BrewwwwTests
    dependencies:
      - target: Brewwww
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiuyuancai.brewwww.tests
        TEST_TARGET_NAME: Brewwww
  BrewwwwUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BrewwwwUITests
    dependencies:
      - target: Brewwww
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiuyuancai.brewwww.uitests
        TEST_TARGET_NAME: Brewwww
  Brewwww:
    type: application
    platform: iOS
    info:
      path: Brewwww/Info.plist
      properties:
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
    sources:
      - path: Brewwww
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiuyuancai.brewwww
        PRODUCT_NAME: Brewwww
        INFOPLIST_KEY_CFBundleDisplayName: 'Un Caffèee!'
schemes:
  Brewwww:
    build:
      targets:
        Brewwww: all
    test:
      targets:
        - BrewwwwTests
        - BrewwwwUITests
